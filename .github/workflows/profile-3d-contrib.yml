# Place this file at: .github/workflows/profile-3d-contrib.yml  in your PROFILE repo
name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 6 * * *"   # runs daily at 6am UTC
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          username: ishitaramola

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -f profile-3d-contrib/*.svg
          git commit -m "Update 3D contribution graph" || echo "No changes to commit"
          git push
