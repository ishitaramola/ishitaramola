<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#283457"/>
      <stop offset="100%" stop-color="#1f2942"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7aa2f7"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="url(#bg)" rx="14"/>

  <text x="450" y="38" text-anchor="middle" font-family="Fira Code, monospace" font-size="20" fill="#c0caf5" font-weight="600">
    Secure Auth Flow — §6.1 Rebuild
  </text>
  <text x="450" y="60" text-anchor="middle" font-family="Fira Code, monospace" font-size="12" fill="#565f89">
    Redis-backed sessions · RS256 JWT · rotating refresh tokens · two-channel invite
  </text>

  <!-- Client -->
  <rect x="30" y="140" width="140" height="70" rx="10" fill="url(#nodeGrad)" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="100" y="170" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#c0caf5">Client</text>
  <text x="100" y="188" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#9aa5ce">React / Vite SPA</text>

  <!-- API Gateway -->
  <rect x="230" y="140" width="150" height="70" rx="10" fill="url(#nodeGrad)" stroke="#bb9af7" stroke-width="1.5"/>
  <text x="305" y="165" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#c0caf5">Express API</text>
  <text x="305" y="182" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#9aa5ce">Auth middleware</text>
  <text x="305" y="197" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#9aa5ce">RS256 verify</text>

  <!-- Redis -->
  <rect x="440" y="60" width="150" height="70" rx="10" fill="url(#nodeGrad)" stroke="#f7768e" stroke-width="1.5"/>
  <text x="515" y="88" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#c0caf5">Redis</text>
  <text x="515" y="105" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#9aa5ce">Session store</text>
  <text x="515" y="120" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#9aa5ce">Refresh token rotation</text>

  <!-- JWT Signer -->
  <rect x="440" y="220" width="150" height="70" rx="10" fill="url(#nodeGrad)" stroke="#9ece6a" stroke-width="1.5"/>
  <text x="515" y="248" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#c0caf5">JWT Signer</text>
  <text x="515" y="265" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#9aa5ce">RS256 private key</text>
  <text x="515" y="280" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#9aa5ce">Short-lived access tok.</text>

  <!-- Invite Channel Email -->
  <rect x="660" y="60" width="180" height="60" rx="10" fill="url(#nodeGrad)" stroke="#e0af68" stroke-width="1.5"/>
  <text x="750" y="85" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#c0caf5">Invite: Email</text>
  <text x="750" y="102" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#9aa5ce">Channel 1 — link</text>

  <!-- Invite Channel SMS -->
  <rect x="660" y="140" width="180" height="60" rx="10" fill="url(#nodeGrad)" stroke="#e0af68" stroke-width="1.5"/>
  <text x="750" y="165" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#c0caf5">Invite: SMS</text>
  <text x="750" y="182" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#9aa5ce">Channel 2 — OTP</text>

  <!-- Salesforce -->
  <rect x="440" y="330" width="150" height="60" rx="10" fill="url(#nodeGrad)" stroke="#7dcfff" stroke-width="1.5"/>
  <text x="515" y="355" text-anchor="middle" font-family="Fira Code, monospace" font-size="13" fill="#c0caf5">Salesforce</text>
  <text x="515" y="372" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#9aa5ce">User / Contact record</text>

  <!-- Arrows -->
  <path d="M170,175 L230,175" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M380,160 L440,110" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M380,190 L440,245" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M590,95 L660,90" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M590,105 L660,165" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <path d="M515,290 L515,330" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <text x="450" y="410" text-anchor="middle" font-family="Fira Code, monospace" font-size="10" fill="#414868">
    MHIC Self-Serve Portal — auth subsystem
  </text>
</svg>
